<div class="auth-center-page">
  <div class="page-overlay"></div>
  <div class="page-light"></div>

  <section class="auth-card">
    <div class="card-header">
      <span class="section-kicker">Sécurité</span>

      <h1>Nouveau mot de passe</h1>

      <p>
        Saisissez votre nouveau mot de passe pour finaliser la réinitialisation.
      </p>
    </div>

    <div class="error-box" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="success-box" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="submit()" class="auth-form" *ngIf="!successMessage">
      <div class="field-group">
        <label>Nouveau mot de passe</label>

        <div class="input-shell">
          <span class="input-icon">●</span>

          <input
            type="password"
            name="newPassword"
            [(ngModel)]="newPassword"
            placeholder="Nouveau mot de passe"
            autocomplete="new-password"
            required
          />
        </div>
      </div>

      <div class="field-group">
        <label>Confirmation</label>

        <div class="input-shell">
          <span class="input-icon">●</span>

          <input
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Confirmer le mot de passe"
            autocomplete="new-password"
            required
          />
        </div>
      </div>

      <button class="auth-btn" type="submit" [disabled]="loading">
        {{ loading ? 'Modification...' : 'Modifier le mot de passe' }}
      </button>
    </form>

    <div class="auth-footer">
      <a routerLink="/login">Retour à la connexion</a>
    </div>
  </section>
</div>
