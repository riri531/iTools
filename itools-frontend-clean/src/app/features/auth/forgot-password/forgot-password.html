<div class="auth-center-page">
  <div class="page-overlay"></div>
  <div class="page-light"></div>

  <section class="auth-card">
    <div class="card-header">
      <span class="section-kicker">Sécurité</span>

      <h1>Mot de passe oublié</h1>

      <p>
        Saisissez votre adresse email. Si elle est associée à un compte iTools,
        un lien de réinitialisation vous sera envoyé.
      </p>
    </div>

    <div class="error-box" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="success-box" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="submit()" class="auth-form">
      <div class="field-group">
        <label>Adresse email</label>

        <div class="input-shell">
          <span class="input-icon">✉</span>

          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="exp@allcircuits.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <button class="auth-btn" type="submit" [disabled]="loading">
        {{ loading ? 'Envoi en cours...' : 'Envoyer le lien' }}
      </button>
    </form>

    <div class="auth-footer">
      <a routerLink="/login">Retour à la connexion</a>
    </div>
  </section>
</div>
