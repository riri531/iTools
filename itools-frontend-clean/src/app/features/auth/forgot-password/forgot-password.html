<div class="auth-page">
  <div class="auth-overlay"></div>

  <section class="auth-card">
    <h1>Mot de passe oublié</h1>

    <p class="auth-description">
      Saisissez votre adresse email afin de générer un lien de réinitialisation.
    </p>

    <div class="error-box" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="success-box" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="submit()" class="auth-form">
      <div class="input-shell">
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="exp@allcircuits.com"
          autocomplete="email"
          required
        />
      </div>

      <button class="auth-btn" type="submit" [disabled]="loading">
        {{ loading ? 'Traitement...' : 'Générer le lien' }}
      </button>
    </form>

    <div class="dev-reset-link" *ngIf="resetLink">
      <p>Lien de réinitialisation généré :</p>
      <a [href]="resetLink">{{ resetLink }}</a>
    </div>

    <div class="auth-footer">
      <a routerLink="/login">Retour à la connexion</a>
    </div>
  </section>
</div>
